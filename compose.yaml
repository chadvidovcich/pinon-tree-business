services:
  pinon-tree-business:
    container_name: portfolio-pinon-tree-business-app
    build:
      context: .
      dockerfile: Dockerfile
    image: pinon-tree-business:latest
    pull_policy: never
    restart: unless-stopped
    networks: [tunnel]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  tunnel:
    external: true
